name: Supabase Keep Alive

# 무료 플랜 Supabase는 약 7일간 활동이 없으면 프로젝트가 일시정지됩니다.
# 매일 한 번 REST API에 가벼운 요청을 보내 "활동 중" 상태를 유지합니다.
# (anon 키는 공개돼도 안전한 키 — config.js 에 이미 공개되어 있음)

on:
  schedule:
    - cron: "17 3 * * *"   # 매일 UTC 03:17 (한국시간 12:17) 1회 실행
  workflow_dispatch:        # 필요하면 Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://qlgiwdwjjbldwjorpkiy.supabase.co/rest/v1/events?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsZ2l3ZHdqamJsZHdqb3Jwa2l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjY2NjQsImV4cCI6MjA5OTU0MjY2NH0.H5SpKEL-6iwihsgKkHa1tC4L7VAaj9anORWWUcKxI58"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}")
          echo "HTTP status: ${CODE}"
          # 200(정상) 또는 RLS로 인한 401/403 모두 DB에 요청이 닿은 것이므로 성공으로 간주
          if [ "${CODE}" = "200" ] || [ "${CODE}" = "401" ] || [ "${CODE}" = "403" ]; then
            echo "Supabase 활동 신호 전송 완료."
          else
            echo "예상치 못한 응답(${CODE}). 프로젝트 상태를 확인하세요."
            exit 1
          fi
